# Example clipbroad configuration (config.toml).
#
# Every field is optional: if one is missing, clipbroad uses the default value shown here.
# If the file does not exist, clipbroad starts with all the default values.
#
# File location:
#   Linux:   ~/.config/clipbroad/config.toml  (or $XDG_CONFIG_HOME/clipbroad/config.toml)
#   macOS:   ~/Library/Application Support/clipbroad/config.toml
#   Windows: %LOCALAPPDATA%\clipbroad\config.toml
#
# The node identity (secret key) does NOT go in this file: it is stored separately in `secret.key`
# and the daemon generates it the first time it starts.
#   Linux:   ~/.local/share/clipbroad/secret.key  (or $XDG_DATA_HOME/...; permissions 0600)
#   macOS:   ~/Library/Application Support/clipbroad/secret.key  (permissions 0600)
#   Windows: %LOCALAPPDATA%\clipbroad\secret.key  (permissions inherited from the user folder)
# On Unix, if someone changes the permissions of `secret.key` so other users can read it,
# clipbroad refuses to start until it is fixed with `chmod 600`.
#
# While it runs, `clipbroad run` writes its status to `status.toml`, in the same folder as
# `secret.key`, and deletes it when it stops. `clipbroad status` reads it.
#
# Files that arrive from other peers are stored in a cache, in `files/<hash>/<name>`:
#   Linux:   ~/.cache/clipbroad/files  (or $XDG_CACHE_HOME/clipbroad/files)
#   macOS:   ~/Library/Caches/clipbroad/files
#   Windows: %LOCALAPPDATA%\clipbroad\files
# With `--config <file>`, the cache is the `files` folder next to that file, so two instances
# on the same machine do not share it.
#
# A misspelled field name is an error (it is not silently ignored).

# UDP port this node listens on. It is fixed so other peers can reach it at a
# static address (for example, over Tailscale). If you change it, update the addresses the
# other peers have for this machine. Must be greater than 0.
listen_port = 42420

# Maximum size (in bytes) of a clip that travels inside the message itself. Default 8 MiB, which
# is enough for text and typical screenshots. Must be greater than 0 and at most 16711680
# (16 MiB minus 64 KiB), because a clip has to fit in a protocol message. Copied text
# larger than this value is not synced (a warning goes to the log).
inline_max_bytes = 8388608

# LAN discovery with mDNS. With `true`, this node announces its id and addresses on the local
# network and finds paired peers even if their IP changes; they do not need `addrs`.
# Anyone on the same LAN can see that announcement (the id is public and grants no access: only
# the peers in this list are accepted). It uses no third-party service. With `false` no multicast
# traffic is sent and the node only connects to peers by their `addrs`.
mdns = true

# Maximum size (in bytes) of a copied file. A larger file is not synced (a
# warning goes to the log). Default 512 MiB. Must be greater than 0 and not greater than
# `file_cache_max_bytes`.
file_max_bytes = 536870912

# Maximum size (in bytes) of the cache of received files. When it is exceeded, the oldest
# files are deleted first, except those of the last received clip. It is also the limit for all the
# files of a single copy together. Default 2 GiB. Must be greater than 0.
file_cache_max_bytes = 2147483648

# Days a received file stays in the cache. Older ones are deleted in the next
# cleanup, except those of the last received clip. Default 7. Must be greater than 0.
file_cache_max_days = 7

# Paired machines. `clipbroad pair` usually writes them; you can edit them by hand.
# Each one has:
#   id     public identity of the peer (64 lowercase hexadecimal characters). Required and
#          unique.
#   name   label for logs and `clipbroad status`. Optional.
#   addrs  "ip:port" addresses to connect directly when LAN discovery does not reach,
#          for example the Tailscale IP (100.x.y.z) or its IPv6 (in brackets). Optional. A peer
#          without `addrs` is only found through mDNS (or when it connects to this node).

[[peers]]
name = "laptop"
id = "ae58ff8833241ac82d6ff7611046ed67b5072d142c588d0063e942d9a75502b6"
addrs = ["100.101.102.103:42420", "[fd7a:115c:a1e0::1]:42420"]

# Peer that is only found over the LAN (no static addresses).
[[peers]]
id = "3b6a27bcceb6a42d62a3a8d02a6f0d73653215771de243a63ac048a18b59da29"
