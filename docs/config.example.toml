# Ejemplo de configuración de clipbroad (config.toml).
#
# Todos los campos son opcionales: si falta uno, se usa el valor por defecto que se muestra aquí.
# Si el archivo no existe, clipbroad arranca con todos los valores por defecto.
#
# Ubicación del archivo:
#   Linux:   ~/.config/clipbroad/config.toml  (o $XDG_CONFIG_HOME/clipbroad/config.toml)
#   macOS:   ~/Library/Application Support/clipbroad/config.toml
#   Windows: %LOCALAPPDATA%\clipbroad\config.toml
#
# La identidad del nodo (clave secreta) NO va en este archivo: se guarda aparte en `secret.key`
# y se genera sola la primera vez que arranca el daemon.
#   Linux:   ~/.local/share/clipbroad/secret.key  (o $XDG_DATA_HOME/...; permisos 0600)
#   macOS:   ~/Library/Application Support/clipbroad/secret.key  (permisos 0600)
#   Windows: %LOCALAPPDATA%\clipbroad\secret.key  (permisos heredados de la carpeta del usuario)
# En Unix, si alguien cambia los permisos de `secret.key` para que otros usuarios puedan leerlo,
# clipbroad se niega a arrancar hasta que se corrija con `chmod 600`.
#
# Mientras corre, `clipbroad run` escribe su estado en `status.toml`, en la misma carpeta que
# `secret.key`, y lo borra al detenerse. Lo lee `clipbroad status`.
#
# Los archivos que llegan de otros peers se guardan en una caché, en `files/<hash>/<nombre>`:
#   Linux:   ~/.cache/clipbroad/files  (o $XDG_CACHE_HOME/clipbroad/files)
#   macOS:   ~/Library/Caches/clipbroad/files
#   Windows: %LOCALAPPDATA%\clipbroad\files
# Con `--config <archivo>`, la caché es la carpeta `files` junto a ese archivo, así dos instancias
# en la misma máquina no la comparten.
#
# Un nombre de campo mal escrito es un error (no se ignora en silencio).

# Puerto UDP en el que escucha este nodo. Es fijo para que otros peers puedan llegar a él por una
# dirección estática (por ejemplo, por Tailscale). Si se cambia, actualizar las direcciones que los
# otros peers tienen de esta máquina. Debe ser mayor que 0.
listen_port = 42420

# Tamaño máximo (en bytes) de un clip que viaja dentro del propio mensaje. Por defecto 8 MiB, que
# alcanza para texto y capturas de pantalla típicas. Debe ser mayor que 0 y como mucho 16711680
# (16 MiB menos 64 KiB), porque un clip tiene que caber en un mensaje del protocolo. Un texto copiado
# más grande que este valor no se sincroniza (queda un warning en el log).
inline_max_bytes = 8388608

# Descubrimiento en la LAN con mDNS. Con `true`, este nodo anuncia su id y sus direcciones en la red
# local y encuentra a los peers emparejados aunque cambien de IP; no hacen falta `addrs` para ellos.
# Cualquiera en la misma LAN puede ver ese anuncio (el id es público y no da acceso: solo se aceptan
# los peers de esta lista). No usa ningún servicio de terceros. Con `false` no se envía tráfico
# multicast y solo se conecta a los peers por sus `addrs`.
mdns = true

# Tamaño máximo (en bytes) de un archivo copiado. Un archivo más grande no se sincroniza (queda un
# warning en el log). Por defecto 512 MiB. Debe ser mayor que 0 y no mayor que
# `file_cache_max_bytes`.
file_max_bytes = 536870912

# Tamaño máximo (en bytes) de la caché de archivos recibidos. Cuando se pasa, se borran primero
# los archivos más viejos, salvo los del último clip recibido. También es el límite de todos los
# archivos de una misma copia juntos. Por defecto 2 GiB. Debe ser mayor que 0.
file_cache_max_bytes = 2147483648

# Días que un archivo recibido se queda en la caché. Los más viejos se borran en la próxima
# limpieza, salvo los del último clip recibido. Por defecto 7. Debe ser mayor que 0.
file_cache_max_days = 7

# Máquinas emparejadas. Normalmente las escribe `clipbroad pair`; se pueden editar a mano.
# Cada una lleva:
#   id     identidad pública del peer (64 caracteres hexadecimales en minúsculas). Obligatorio y
#          sin repetir.
#   name   etiqueta para logs y `clipbroad status`. Opcional.
#   addrs  direcciones "ip:puerto" para conectar directo cuando el descubrimiento en la LAN no llega,
#          por ejemplo la IP de Tailscale (100.x.y.z) o su IPv6 (entre corchetes). Opcional. Un peer
#          sin `addrs` solo se encuentra por mDNS (o cuando él se conecta a este nodo).

[[peers]]
name = "laptop"
id = "ae58ff8833241ac82d6ff7611046ed67b5072d142c588d0063e942d9a75502b6"
addrs = ["100.101.102.103:42420", "[fd7a:115c:a1e0::1]:42420"]

# Peer que solo se encuentra por la LAN (sin direcciones estáticas).
[[peers]]
id = "3b6a27bcceb6a42d62a3a8d02a6f0d73653215771de243a63ac048a18b59da29"
