[package]
name = "clipbroad"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Lets the environment replace the release URL, signing key and current version. Only for
# tests/update_smoke.rs: a release build never turns it on.
update-smoke = []

[[test]]
name = "update_smoke"
required-features = ["update-smoke"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
clipbroad-clipboard.workspace = true
clipbroad-config.workspace = true
clipbroad-core.workspace = true
clipbroad-net.workspace = true
iroh.workspace = true
minisign-verify.workspace = true
postcard.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tray-icon.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["system"] }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { workspace = true, features = ["ksni"] }
zbus.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["std", "NSApplication", "NSEvent", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { workspace = true, features = ["std", "NSDate", "NSString"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
minisign.workspace = true

[lints]
workspace = true
