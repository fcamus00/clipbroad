[package]
name = "clipbroad-clipboard"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["event"] }
wl-clipboard-rs.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["std", "NSPasteboard"] }
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSEnumerator", "NSString"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
