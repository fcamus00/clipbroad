name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  TAG: ${{ github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            exe: clipbroad
          # macos-latest runners are Apple Silicon.
          - os: macos-latest
            target: macos-aarch64
            exe: clipbroad
          - os: windows-latest
            target: windows-x86_64
            exe: clipbroad.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # No rust-cache: release builds start clean, and releases are rare.
      - run: cargo build --release --locked -p clipbroad
      # The binary must report the tag's version (v0.2.0 and v0.2.0-rc.1 both expect 0.2.0).
      - name: Check version
        shell: bash
        run: |
          version="${TAG#v}"
          version="${version%%-*}"
          actual="$(target/release/${{ matrix.exe }} --version)"
          if [ "$actual" != "clipbroad $version" ]; then
            echo "::error::tag $TAG expects 'clipbroad $version', binary reports '$actual'. Bump the version in Cargo.toml."
            exit 1
          fi
      - name: Package
        shell: bash
        run: |
          name="clipbroad-$TAG-${{ matrix.target }}"
          mkdir "$name"
          cp "target/release/${{ matrix.exe }}" README.md LICENSE-APACHE LICENSE-MIT "$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$name.zip" "$name"
          else
            tar -czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: |
            clipbroad-*.tar.gz
            clipbroad-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      # Attached to every release, so releases/latest/download/install.sh is the latest stable one.
      - run: cp packaging/install.sh dist/
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Tags with a suffix (v0.2.0-rc.1) are pre-releases.
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/* --verify-tag --generate-notes "${prerelease[@]}"

  # Updates the Homebrew tap and the Scoop bucket. Pre-releases stay on GitHub only.
  publish:
    name: publish (${{ matrix.target }})
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: homebrew-tap
            repo: git@github.com:fcamus00/homebrew-tap.git
            branch: main
            key: HOMEBREW_TAP_SSH_KEY
          - target: scoop-bucket
            repo: git@github.com:fcamus00/scoop-bucket.git
            branch: main
            key: SCOOP_BUCKET_SSH_KEY
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Render
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --pattern SHA256SUMS
          packaging/render.sh "${TAG#v}" SHA256SUMS out
      - name: Push
        env:
          SSH_KEY: ${{ secrets[matrix.key] }}
          TARGET: ${{ matrix.target }}
          REPO: ${{ matrix.repo }}
          BRANCH: ${{ matrix.branch }}
        run: |
          key="$RUNNER_TEMP/key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$SSH_KEY" > "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$PWD/packaging/known_hosts"
          git clone "$REPO" repo
          cp -r "out/$TARGET/." repo/
          cd repo
          git add -A
          # A re-run after a partial failure has nothing new to commit.
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "clipbroad ${TAG#v}"
          git push origin "HEAD:$BRANCH"
