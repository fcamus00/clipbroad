[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
clipbroad-core = { path = "crates/core" }
clipbroad-clipboard = { path = "crates/clipboard" }
clipbroad-net = { path = "crates/net" }
clipbroad-config = { path = "crates/config" }
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
data-encoding = "2.11"
getrandom = "0.4"
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
iroh-mdns-address-lookup = "0.6.1"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }
png = "0.18.1"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
rustix = "1.1"
serde = { version = "1.0", features = ["derive"] }
subtle = "2.6"
tempfile = "3.27"
thiserror = "2.0"
tokio = "1.54"
toml = "1.1"
# Default features pull GTK and libappindicator on Linux; the daemon turns on `ksni` there instead.
tray-icon = { version = "0.26.1", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt"] }
windows-sys = "0.61.2"
wl-clipboard-rs = "0.9.5"
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
strip = true
