[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
clipbroad-core = { path = "crates/core" }
clipbroad-clipboard = { path = "crates/clipboard" }
clipbroad-net = { path = "crates/net" }
clipbroad-config = { path = "crates/config" }
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.4"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.27"
thiserror = "2.0"
tokio = "1.54"
toml = "1.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
strip = true
